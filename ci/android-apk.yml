# Baut bei jedem Push auf main die Android-App (Ablauf steht in ci/build-android.sh)
# und stellt sie unter „Releases → Test-APK (neueste)“ bereit.
name: Android Test-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: App bauen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ci/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DoenerPalast-android
          path: out/*

      - name: Als „Test-APK (neueste)“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/*.apk \
            --title "Test-APK (neueste) – v${VER} Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben). Die .aab-Datei für den Play Store liegt unter Actions → Artifacts." \
            --prerelease \
            --target "${GITHUB_SHA}"
